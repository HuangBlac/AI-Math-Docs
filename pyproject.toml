[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-math-study"
version = "0.1.0"
description = "Evidence-grounded local study tools for AI-Math-Docs and LFTP"
requires-python = ">=3.12"
dependencies = [
  "openai>=2.16,<3",
  "pydantic>=2.12,<3",
  "jsonschema>=4.25,<5",
  "typer>=0.21,<1",
  "rich>=14,<15",
  "PyMuPDF>=1.27,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "pytest-asyncio>=1,<2",
  "hypothesis>=6,<7",
  "ruff>=0.14,<1",
  "mypy>=1.19,<2",
  "types-jsonschema>=4.25,<5",
]

[project.scripts]
aimath-study = "ai_math_study.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_math_study = ["data/*.json", "prompts/*.md", "migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["online: requires OPENAI_API_KEY and live model access"]

[tool.ruff]
target-version = "py312"
line-length = 110
